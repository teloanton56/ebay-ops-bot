name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check JavaScript syntax
        run: |
          node --check app/static/provider_cleanup.js
          node --check app/static/workflow_cleanup.js
          node --check app/static/supplier_flow_v2.js
          node --check app/static/product_research.js
          node --check app/static/auto_radar.js
          node --check app/static/tiered_radar.js
      - name: Run tests
        env:
          APP_ACCESS_MODE: local
          DATABASE_PATH: /tmp/ebay-ops-bot-tests.db
          APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: python -m pytest -q
